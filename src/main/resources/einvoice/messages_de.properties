# Command line
cli.title={0} {1} – Kommandozeile
cli.usage=Aufruf: <Programm> <Entität> <Aktion> [Optionen]\n\
\n\
Befehle:\n\
\  company list      Firmen mit ihrer Kennung anzeigen\n\
\  customer list     Kunden einer Firma mit Steuerfall und Leistungen anzeigen\n\
\  invoice list      Mit der App erstellte Rechnungen anzeigen\n\
\  invoice create    Neue Rechnung erstellen\n\
\  help              Diese Hilfe anzeigen\n\
\  version           Version anzeigen\n\
\n\
Für alle Befehle:\n\
\  --company <Kennung>          Firma; entfällt, wenn es nur eine gibt\n\
\  --data-dir <Ordner>          anderer Datenordner als in der App eingestellt\n\
\n\
invoice list:\n\
\  --year <JJJJ>                nur Rechnungen dieses Jahres\n\
\  --customer <Kennung>         nur Rechnungen dieses Kunden\n\
\n\
invoice create (genau eine Vorlage angeben):\n\
\  --from <Rechnungsnummer>     Kunde und Positionen einer früheren Rechnung übernehmen\n\
\  --customer <Kennung>         vorbelegte Leistungen des Kunden übernehmen\n\
\  --date <JJJJ-MM-TT>          Rechnungsdatum, sonst heute\n\
\  --period <JJJJ-MM>           Leistungszeitraum als Monat, sonst der Vormonat\n\
\  --service-from <JJJJ-MM-TT>  Beginn des Leistungszeitraums\n\
\  --service-to <JJJJ-MM-TT>    Ende des Leistungszeitraums\n\
\  --qty <Menge>                Menge; jede Angabe gilt für die nächste Position\n\
\  --price <Preis>              Einzelpreis netto; jede Angabe gilt für die nächste Position\n\
\  --text <Text>                Positionstext; jede Angabe gilt für die nächste Position\n\
\  --unit <Einheit>             Einheit; jede Angabe gilt für die nächste Position\n\
\  --item "Text;Menge;Einheit;Preis"  ersetzt alle Positionen, mehrfach möglich\n\
\  --dry-run                    nur anzeigen, nichts speichern\n\
\n\
In Texten steht \\n für einen Zeilenumbruch. Platzhalter wie {period} oder {month} werden ersetzt.\n\
Die Rechnungsnummer vergibt die App wie in der Oberfläche fortlaufend.\n\
\n\
Beispiele:\n\
\  invoice list --company musterfirma-gmbh --year 2026\n\
\  invoice create --company musterfirma-gmbh --from RE-2026-00042 --qty 6,75 --dry-run\n\
\  invoice create --customer beispielkunde-gmbh --text "Wartung der Website" --qty 1 --price 240
