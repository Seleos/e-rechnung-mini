# Command line
cli.title={0} {1} – command line
cli.usage=Usage: <program> <entity> <action> [options]\n\
\n\
Commands:\n\
\  company list      Show the companies with their id\n\
\  customer list     Show the customers of a company with tax case and services\n\
\  invoice list      Show the invoices created with the app\n\
\  invoice create    Create a new invoice\n\
\  help              Show this help\n\
\  version           Show the version\n\
\n\
For all commands:\n\
\  --company <id>               company; may be left out if there is only one\n\
\  --data-dir <folder>          data folder other than the one set in the app\n\
\n\
invoice list:\n\
\  --year <YYYY>                only invoices of this year\n\
\  --customer <id>              only invoices of this customer\n\
\n\
invoice create (give exactly one template):\n\
\  --from <invoice number>      take customer and line items from an earlier invoice\n\
\  --customer <id>              take the pre-filled services of the customer\n\
\  --date <YYYY-MM-DD>          invoice date, otherwise today\n\
\  --period <YYYY-MM>           service period as a month, otherwise the previous month\n\
\  --service-from <YYYY-MM-DD>  start of the service period\n\
\  --service-to <YYYY-MM-DD>    end of the service period\n\
\  --qty <quantity>             quantity; each value applies to the next line item\n\
\  --price <price>              net unit price; each value applies to the next line item\n\
\  --text <text>                line item text; each value applies to the next line item\n\
\  --unit <unit>                unit; each value applies to the next line item\n\
\  --item "text;quantity;unit;price"  replaces all line items, may be repeated\n\
\  --dry-run                    only show the invoice, save nothing\n\
\n\
In texts, \\n stands for a line break. Placeholders such as {period} or {month} are replaced.\n\
The app assigns the next invoice number, just as in the user interface.\n\
\n\
Examples:\n\
\  invoice list --company musterfirma-gmbh --year 2026\n\
\  invoice create --company musterfirma-gmbh --from RE-2026-00042 --qty 6.75 --dry-run\n\
\  invoice create --customer beispielkunde-gmbh --text "Website maintenance" --qty 1 --price 240
