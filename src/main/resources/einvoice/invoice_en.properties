# Text below the invoice that a new company starts with; may contain placeholders
payment.default=Please transfer the invoice amount to the account below by {due}. Please quote the invoice number {number} with your payment.

email.subject=Invoice {number} for {month} {year}
email.body=Hello,\n\nplease find attached invoice {number} for {month} {year} for {amount}.\nThe invoice is an e-invoice in ZUGFeRD format. The PDF also contains the invoice data in machine-readable form.\n\nPayable by {due}.\n\nKind regards\n\n{footer}
