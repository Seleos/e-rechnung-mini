# Weekly pull requests for outdated libraries, build plugins and workflow actions.
# Security alerts for vulnerable libraries are enabled in the repository settings under "Code security".
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Mustang brings its own Apache FOP. Updating FOP on its own would mix two versions,
      # so it is only raised together with Mustang.
      - dependency-name: "org.apache.xmlgraphics:fop"
    groups:
      javafx:
        patterns: ["org.openjfx:*"]
      mustang:
        patterns: ["org.mustangproject:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
