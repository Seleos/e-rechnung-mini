# Builds, tests and lints the project on every push and pull request, on all supported operating systems.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Conventional Commits with the types and scopes listed in AGENTS.md. Merge commits are skipped.
      - name: Check commit messages
        run: |
          pattern='^(feat|fix|docs|test|refactor|build|ci|chore)(\((core|model|storage|service|ui|i18n|template|site|deps|release)\))?!?: [^ ].*[^.]$'
          failed=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "Not a conventional commit: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $failed

  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Linux runners have no display; xvfb provides a virtual one for the user interface test.
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./mvnw -B verify
      - name: Verify (macOS, Windows)
        if: runner.os != 'Linux'
        run: ./mvnw -B verify
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: |
            target/surefire-reports
            target/site/jacoco
            target/generated-sources/license/THIRD-PARTY.txt
            target/bom.json
          if-no-files-found: ignore
